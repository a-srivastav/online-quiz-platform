<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create quiz | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="form-page"><section class="form-card wide"><span class="eyebrow">NEW QUIZ</span><h1>Create a quiz</h1><p class="muted">Add the quiz details first. You can then add questions and publish it.</p><div class="notice error" th:if="${error}" th:text="${error}"></div><form method="post" action="/creator/quizzes" class="stack"><label>Quiz title<input name="title" maxlength="180" required></label><label>Description<textarea name="description" rows="4"></textarea></label><label>Time limit (minutes)<input type="number" name="durationMinutes" min="1" max="180" value="20" required></label><button class="button">Create and add questions</button></form><p class="form-bottom"><a href="/dashboard">← Back to dashboard</a></p></section></main><footer>QuizHub · Creator workspace</footer></body></html>
<!-- Quiz creation page: the form collects a title, description, and time limit before sending the creator to add questions. A conditional error notice uses th:if and th:text to show validation feedback. -->
