<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${quiz.title+' | QuizHub'}">Take quiz</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page narrow"><div class="page-heading"><div><span class="eyebrow">QUIZ IN PROGRESS</span><h1 th:text="${quiz.title}"></h1><p class="muted" th:text="${quiz.durationMinutes+' minute time limit'}"></p></div><div class="timer" data-minutes="0" th:attr="data-minutes=${quiz.durationMinutes}"><span id="timer">--:--</span><small>remaining</small></div></div><form method="post" th:action="@{/attempts/{id}/submit(id=${attempt.id})}" id="quiz-form"><article class="question-block" th:each="q,stat:${questions}"><h2><span class="question-number" th:text="${stat.count}">1</span><span th:text="${q.text}">Question</span><small th:text="${q.points+' points'}"></small></h2><label class="answer-option"><input type="radio" th:name="${'q_'+q.id}" value="A"><span><b>A</b><span th:text="${q.optionA}"></span></span></label><label class="answer-option"><input type="radio" th:name="${'q_'+q.id}" value="B"><span><b>B</b><span th:text="${q.optionB}"></span></span></label><label class="answer-option"><input type="radio" th:name="${'q_'+q.id}" value="C"><span><b>C</b><span th:text="${q.optionC}"></span></span></label><label class="answer-option"><input type="radio" th:name="${'q_'+q.id}" value="D"><span><b>D</b><span th:text="${q.optionD}"></span></span></label></article><button class="button" onclick="return confirm('Submit your answers now?')">Submit quiz</button></form></main><footer>QuizHub · Your answers are saved when you submit.</footer><script src="/js/timer.js" defer></script></body></html>
<!-- Quiz attempt page: the heading shows quiz details and the remaining-time display; the form lists question blocks and answer choices before submission. th:each repeats questions, th:text displays their values, and th:action builds the attempt-specific submission route. The timer script is loaded after the page content. -->
