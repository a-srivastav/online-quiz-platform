<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin reports | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">ADMINISTRATION</span><h1>Platform overview</h1><p class="muted">Users, quizzes, and participant activity.</p></div></div><div class="stats"><div class="stat"><b th:text="${users.size()}">0</b><span>Users</span></div><div class="stat"><b th:text="${quizzes.size()}">0</b><span>Quizzes</span></div><div class="stat"><b th:text="${reports.size()}">0</b><span>Attempts</span></div></div><section class="panel"><h2>Users</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td><span class="pill" th:text="${u.role}"></span></td><td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}"></td></tr></tbody></table></div></section><section class="panel"><h2>Quizzes</h2><div class="table-wrap"><table><thead><tr><th>Title</th><th>Creator ID</th><th>Duration</th><th>Status</th></tr></thead><tbody><tr th:each="q:${quizzes}"><td th:text="${q.title}"></td><td th:text="${q.creatorId}"></td><td th:text="${q.durationMinutes+' min'}"></td><td th:text="${q.published?'Published':'Draft'}"></td></tr></tbody></table></div></section><section class="panel"><h2>Attempt reports</h2><div class="table-wrap"><table><thead><tr><th>Quiz</th><th>Participant</th><th>Score</th><th>Status</th><th>Started</th></tr></thead><tbody><tr th:each="r:${reports}"><td th:text="${r.quiz_title}"></td><td th:text="${r.participant}"></td><td th:text="${r.score+' / '+r.total_points}"></td><td th:text="${r.status}"></td><td th:text="${r.started_at}"></td></tr><tr th:if="${reports.isEmpty()}"><td colspan="5" class="muted">No attempts recorded yet.</td></tr></tbody></table></div></section></main><footer>QuizHub · Administration</footer></body></html>
