<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="form-page"><section class="form-card"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p class="muted">Continue learning where you left off.</p><div class="notice success" th:if="${param.registered}">Account created. You can now log in.</div><div class="notice error" th:if="${error}" th:text="${error}"></div><form method="post" action="/login" class="stack"><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button full">Log in</button></form><p class="form-bottom">New here? <a href="/register">Create an account</a></p></section></main><footer>QuizHub · A learning project for better practice.</footer></body></html>
<!-- Login page: the form collects email and password, with conditional success and validation notices above it. th:if controls each notice's visibility and th:text displays a validation message; the form posts credentials to the login route. -->
