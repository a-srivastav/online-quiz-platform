<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="form-page"><section class="form-card"><span class="eyebrow">JOIN QUIZHUB</span><h1>Create account</h1><p class="muted">Choose how you want to use the platform.</p><div class="notice error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="stack"><label>Your name<input name="name" required maxlength="120"></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required><small>At least 8 characters.</small></label><label>Account type<select name="role" required><option value="PARTICIPANT">Participant — take quizzes</option><option value="CREATOR">Quiz creator — build quizzes</option></select></label><button class="button full">Create account</button></form><p class="form-bottom">Already registered? <a href="/login">Log in</a></p></section></main><footer>QuizHub · A learning project for better practice.</footer></body></html>
