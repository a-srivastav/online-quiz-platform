<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attempt history | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">YOUR PROGRESS</span><h1>Attempt history</h1><p class="muted">Review quiz attempts and submitted scores.</p></div><a class="button" href="/quizzes">Take a quiz</a></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Quiz ID</th><th>Score</th><th>Status</th><th>Started</th><th>Submitted</th><th>Result</th></tr></thead><tbody><tr th:each="a:${attempts}"><td th:text="${a.quizId}"></td><td th:text="${a.score+' / '+a.totalPoints}"></td><td><span class="pill" th:text="${a.status}"></span></td><td th:text="${a.startedAt}"></td><td th:text="${a.submittedAt == null ? '—' : a.submittedAt}"></td><td><a th:if="${a.status=='SUBMITTED'}" class="text-link" th:href="@{/results/{id}(id=${a.id})}">View result</a></td></tr><tr th:if="${attempts.isEmpty()}"><td colspan="6" class="muted">No attempts yet. Pick a quiz to get started.</td></tr></tbody></table></div></section></main><footer>QuizHub · Participant space</footer></body></html>
<!-- Attempt history: the heading links back to quiz browsing, and the table lists each participant attempt, score, status, timestamps, and available result link. th:each repeats attempt rows; th:text displays values; th:if controls result links and the empty-state row. -->
