<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your result | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="form-page"><section class="result-card"><span class="eyebrow">QUIZ RESULT</span><h1 th:text="${result.quiz_title}">Quiz title</h1><div class="score" th:text="${result.score+' / '+result.total_points}">0 / 0</div><p class="muted">Your final score</p><div class="progress"><span th:style="${'width:'+result.percentage+'%'}"></span></div><p><strong th:text="${#numbers.formatDecimal(result.percentage,1,1)+'%'}"></strong> of available points</p><div class="actions center"><a class="button" href="/history">View attempt history</a><a class="button secondary" href="/quizzes">Try another quiz</a></div></section></main><footer>QuizHub · Keep practicing.</footer></body></html>
<!-- Result page: the result card shows the quiz title, earned points, percentage progress, and links to history or another quiz. th:text fills server-provided result values, and th:style sets the progress-bar width from the result percentage. -->
