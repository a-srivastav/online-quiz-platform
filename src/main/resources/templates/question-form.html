<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="form-page"><section class="form-card wide"><span class="eyebrow">QUESTION BUILDER</span><h1 th:text="${question == null ? 'Add a question' : 'Edit question'}"></h1><p class="muted" th:text="${quiz.title}"></p><form method="post" th:action="@{/creator/quizzes/{id}/questions(id=${quiz.id})}" class="stack"><input th:if="${question != null}" type="hidden" name="questionId" th:value="${question.id}"><label>Question<textarea name="text" rows="3" required th:text="${question?.text}"></textarea></label><label>Option A<input name="optionA" required th:value="${question?.optionA}"></label><label>Option B<input name="optionB" required th:value="${question?.optionB}"></label><label>Option C<input name="optionC" required th:value="${question?.optionC}"></label><label>Option D<input name="optionD" required th:value="${question?.optionD}"></label><div class="form-grid"><label>Correct answer<select name="correctOption" required><option value="A" th:selected="${question?.correctOption == 'A'}">A</option><option value="B" th:selected="${question?.correctOption == 'B'}">B</option><option value="C" th:selected="${question?.correctOption == 'C'}">C</option><option value="D" th:selected="${question?.correctOption == 'D'}">D</option></select></label><label>Points<input type="number" name="points" min="1" value="1" th:value="${question?.points ?: 1}" required></label></div><button class="button" th:text="${question == null ? 'Add question' : 'Save changes'}"></button></form><p class="form-bottom"><a th:href="@{/creator/quizzes/{id}/questions(id=${quiz.id})}">← Back to questions</a></p></section></main><footer>QuizHub · Question builder</footer></body></html>
