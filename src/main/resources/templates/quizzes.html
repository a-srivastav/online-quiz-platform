<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzes | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">PRACTICE LIBRARY</span><h1>Available quizzes</h1><p class="muted">Pick a quiz and see what you know.</p></div></div><div class="cards" th:if="${!quizzes.isEmpty()}"><article class="quiz-card" th:each="quiz:${quizzes}"><span class="pill">PUBLISHED</span><h3 th:text="${quiz.title}"></h3><p th:text="${quiz.description}"></p><div class="card-meta"><span th:text="${quiz.durationMinutes+' minutes'}"></span><span>Multiple choice</span></div><a th:if="${currentUser != null and currentUser.role == 'PARTICIPANT'}" class="button small" th:href="@{/quizzes/{id}/start(id=${quiz.id})}">Start quiz</a><a th:if="${currentUser == null}" class="text-link" href="/login">Log in to take this quiz →</a></article></div><div class="empty" th:if="${quizzes.isEmpty()}">No quizzes have been published yet.</div></main><footer>QuizHub · A learning project for better practice.</footer></body></html>
