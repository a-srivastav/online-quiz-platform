<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage questions | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">QUESTION BUILDER</span><h1 th:text="${quiz.title}">Quiz title</h1><p class="muted">Add and maintain the multiple-choice questions for this quiz.</p></div><a class="button" th:href="@{/creator/quizzes/{id}/questions/new(id=${quiz.id})}">Add question</a></div><div class="notice" th:if="${questions.isEmpty()}">Add at least one question before publishing this quiz.</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Question</th><th>Choices</th><th>Points</th><th>Actions</th></tr></thead><tbody><tr th:each="q:${questions}"><td th:text="${q.text}"></td><td th:text="${q.optionA+' / '+q.optionB+' / '+q.optionC+' / '+q.optionD}"></td><td th:text="${q.points}"></td><td><a class="text-link" th:href="@{/creator/quizzes/{id}/questions/{qid}/edit(id=${quiz.id},qid=${q.id})}">Edit</a><form class="inline" method="post" th:action="@{/creator/quizzes/{id}/questions/{qid}/delete(id=${quiz.id},qid=${q.id})}"><button class="link-button danger-text" onclick="return confirm('Delete this question?')">Delete</button></form></td></tr></tbody></table></div></section><p><a href="/dashboard" class="text-link">← Back to dashboard</a></p></main><footer>QuizHub · Question builder</footer></body></html>
<!-- Question management page: the heading identifies the quiz and links to the add form; a conditional notice reminds creators to add questions, and the table lists question text, choices, points, and edit/delete actions. th:each repeats rows; th:href and th:action build routes using quiz and question IDs. -->
