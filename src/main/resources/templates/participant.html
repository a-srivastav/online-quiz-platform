<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | QuizHub</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">PARTICIPANT DASHBOARD</span><h1>Welcome, <span th:text="${currentUser.name}"></span></h1><p class="muted">Choose a quiz to practice or review your recent attempts.</p></div><a class="button" href="/quizzes">Browse quizzes</a></div><section class="panel"><h2>Available quizzes</h2><div class="cards"><article class="quiz-card" th:each="q:${quizzes}"><span class="pill">PUBLISHED</span><h3 th:text="${q.title}"></h3><p th:text="${q.description}"></p><div class="card-meta"><span th:text="${q.durationMinutes+' minutes'}"></span><a th:href="@{/quizzes/{id}/start(id=${q.id})}" class="text-link">Start →</a></div></article></div><p class="muted" th:if="${quizzes.isEmpty()}">No quizzes are available right now.</p></section><section class="panel"><h2>Recent attempts</h2><div class="table-wrap"><table><thead><tr><th>Quiz ID</th><th>Score</th><th>Status</th><th>Started</th><th>Result</th></tr></thead><tbody><tr th:each="a:${attempts}"><td th:text="${a.quizId}"></td><td th:text="${a.score+' / '+a.totalPoints}"></td><td th:text="${a.status}"></td><td th:text="${a.startedAt}"></td><td><a th:if="${a.status=='SUBMITTED'}" class="text-link" th:href="@{/results/{id}(id=${a.id})}">View</a></td></tr><tr th:if="${attempts.isEmpty()}"><td colspan="5" class="muted">Your attempts will appear here.</td></tr></tbody></table></div></section></main><footer>QuizHub · Participant space</footer></body></html>
<!-- Participant dashboard: the heading offers quiz browsing, cards list available quizzes, and a table summarizes recent attempts. th:each creates one card or row per item, th:text displays model values, and th:if conditionally shows result links or empty-state messages. -->
