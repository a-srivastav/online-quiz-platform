# Application identity and local HTTP port.
spring.application.name=Online Quiz Management System
server.port=8080

# MySQL connection settings; connection details are supplied outside this file.
spring.datasource.url=${QUIZ_DB_URL}
spring.datasource.username=${QUIZ_DB_USER}
spring.datasource.password=${QUIZ_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database schema/data scripts are managed separately rather than auto-run at startup.
spring.sql.init.mode=never

# Disable template caching for development and use the application's custom error page.
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
